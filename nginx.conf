worker_processes 1;
daemon off;

events { worker_connections 1024; }

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;

    server {
        listen 80;
        server_name _;

        # 1. Reverse Proxy for Node.js API
        location /api/ {
            proxy_pass http://127.0.0.1:3000/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # 2. Local Uploads
        location /uploads/ {
            alias /app/data/uploads/;
        }

        # 3. Serve React Admin Dashboard
        location /admin-dashboard/ {
            alias /var/www/html/admin-dashboard/;
            try_files $uri $uri/ /admin-dashboard/index.html;
        }

        # 4. Serve Driver PWA
        location /driver-app/ {
            alias /var/www/html/driver-app/;
            try_files $uri $uri/ /driver-app/index.html;
        }

        # 5. Serve Student PWA
        location /student-app/ {
            alias /var/www/html/student-app/;
            try_files $uri $uri/ /student-app/index.html;
        }

        # 6. Default root redirect to admin
        location = / {
            return 301 /admin-dashboard/;
        }
    }
}