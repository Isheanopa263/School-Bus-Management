<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Tracking - BusTrack Admin</title>
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/tracking.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
  </head>
  <body>
    <!-- Mobile Top Nav -->
    <nav class="top-nav">
      <button class="menu-toggle" id="menuToggle">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>
      <div class="top-nav-brand">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path
            d="M4 16V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10"
            stroke="currentColor"
            stroke-width="2"
          />
          <path
            d="M4 16h16v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2z"
            fill="currentColor"
          />
        </svg>
        <span>BusTrack Admin</span>
      </div>
    </nav>

    <div class="app-layout">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-brand">
            <div class="sidebar-brand-icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                <path
                  d="M4 16V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10"
                  stroke="#6366f1"
                  stroke-width="2"
                />
                <path
                  d="M4 16h16v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2z"
                  fill="#6366f1"
                />
                <circle cx="7.5" cy="16.5" r="1.5" fill="white" />
                <circle cx="16.5" cy="16.5" r="1.5" fill="white" />
              </svg>
            </div>
            <span class="sidebar-title">BusTrack</span>
          </div>
          <button class="sidebar-collapse-btn" id="sidebarCollapse">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="15 18 9 12 15 6" />
            </svg>
          </button>
        </div>

        <nav class="sidebar-nav">
          <div class="sidebar-section-label">Main</div>
          <a
            href="dashboard.html"
            class="sidebar-link"
            data-page="dashboard.html"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="3" width="7" height="7" />
              <rect x="14" y="3" width="7" height="7" />
              <rect x="3" y="14" width="7" height="7" />
              <rect x="14" y="14" width="7" height="7" />
            </svg>
            <span class="sidebar-link-text">Dashboard</span>
          </a>
          <a
            href="live-tracking.html"
            class="sidebar-link active"
            data-page="live-tracking.html"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="10" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <span class="sidebar-link-text">Live Tracking</span>
          </a>

          <div class="sidebar-section-label">Management</div>
          <a href="buses.html" class="sidebar-link" data-page="buses.html">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="5" width="18" height="12" rx="2" />
              <path d="M7 17v2M17 17v2" />
            </svg>
            <span class="sidebar-link-text">Buses</span>
          </a>
          <a href="drivers.html" class="sidebar-link" data-page="drivers.html">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            <span class="sidebar-link-text">Drivers</span>
          </a>
          <a href="routes.html" class="sidebar-link" data-page="routes.html">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6" />
              <line x1="8" y1="2" x2="8" y2="18" />
              <line x1="16" y1="6" x2="16" y2="22" />
            </svg>
            <span class="sidebar-link-text">Routes</span>
          </a>
          <a
            href="schedule-builder.html"
            class="sidebar-link"
            data-page="schedule-builder.html"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
              <line x1="16" y1="2" x2="16" y2="6" />
              <line x1="8" y1="2" x2="8" y2="6" />
              <line x1="3" y1="10" x2="21" y2="10" />
            </svg>
            <span class="sidebar-link-text">Schedule Builder</span>
          </a>

          <div class="sidebar-section-label">Operations</div>
          <a
            href="student-requests.html"
            class="sidebar-link"
            data-page="student-requests.html"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
              />
              <polyline points="14 2 14 8 20 8" />
            </svg>
            <span class="sidebar-link-text">Requests</span>
          </a>
          <a
            href="complaints.html"
            class="sidebar-link"
            data-page="complaints.html"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
              />
              <line x1="12" y1="9" x2="12" y2="13" />
              <line x1="12" y1="17" x2="12.01" y2="17" />
            </svg>
            <span class="sidebar-link-text">Complaints</span>
          </a>
          <a href="reports.html" class="sidebar-link" data-page="reports.html">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="18" y1="20" x2="18" y2="10" />
              <line x1="12" y1="20" x2="12" y2="4" />
              <line x1="6" y1="20" x2="6" y2="14" />
            </svg>
            <span class="sidebar-link-text">Reports</span>
          </a>
        </nav>

        <div class="sidebar-footer">
          <a href="#" class="sidebar-link" id="logoutBtn">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            <span class="sidebar-link-text">Logout</span>
          </a>
        </div>
      </aside>

      <div class="sidebar-overlay" id="sidebarOverlay"></div>

      <!-- Content -->
      <div class="content-area">
        <main class="main tracking-main">
          <div class="page-header">
            <div>
              <h1>Live Tracking</h1>
              <p class="subtitle">
                Real-time bus locations and trip monitoring
              </p>
            </div>
            <div class="tracking-controls">
              <button class="btn btn-secondary btn-sm" id="refreshBtn">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <polyline points="23 4 23 10 17 10" />
                  <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
                </svg>
                Refresh
              </button>
              <div class="auto-refresh">
                <label class="toggle-label">
                  <input type="checkbox" id="autoRefresh" checked />
                  <span class="toggle-slider"></span>
                  <span class="toggle-text">Auto-refresh</span>
                </label>
              </div>
            </div>
          </div>

          <!-- Tracking Layout -->
          <div class="tracking-layout">
            <!-- Bus List Panel -->
            <div class="bus-panel card">
              <div class="bus-panel-header">
                <h3>Active Buses</h3>
                <span class="badge-count" id="activeBusCount">0</span>
              </div>
              <div class="bus-search">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <circle cx="11" cy="11" r="8" />
                  <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input
                  type="text"
                  id="busSearch"
                  class="bus-search-input"
                  placeholder="Search bus..."
                />
              </div>
              <div class="bus-list" id="busList">
                <div class="empty-state">
                  <div class="spinner"></div>
                  <p>Loading buses...</p>
                </div>
              </div>
            </div>

            <!-- Map -->
            <div class="map-panel">
              <div id="trackingMap" class="tracking-map"></div>

              <!-- Selected Bus Info Overlay -->
              <div class="bus-info-overlay hidden" id="busInfoOverlay">
                <button class="overlay-close" id="closeOverlay">&times;</button>
                <div class="overlay-header">
                  <div class="overlay-bus-icon">🚌</div>
                  <div>
                    <div class="overlay-bus-name" id="overlayBusName">-</div>
                    <div class="overlay-route" id="overlayRoute">-</div>
                  </div>
                </div>
                <div class="overlay-stats">
                  <div class="overlay-stat">
                    <span class="overlay-stat-label">Driver</span>
                    <span class="overlay-stat-value" id="overlayDriver">-</span>
                  </div>
                  <div class="overlay-stat">
                    <span class="overlay-stat-label">Speed</span>
                    <span class="overlay-stat-value" id="overlaySpeed">-</span>
                  </div>
                  <div class="overlay-stat">
                    <span class="overlay-stat-label">Last Update</span>
                    <span class="overlay-stat-value" id="overlayTime">-</span>
                  </div>
                  <div class="overlay-stat">
                    <span class="overlay-stat-label">Status</span>
                    <span class="overlay-stat-value" id="overlayStatus">-</span>
                  </div>
                </div>
                <button
                  class="btn btn-primary btn-sm"
                  id="viewTrailBtn"
                  style="width: 100%; margin-top: 12px"
                >
                  View Trail
                </button>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-messaging-compat.js"></script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/sidebar.js"></script>
    <script src="assets/js/push.js"></script>
    <script src="assets/js/tracking.js"></script>
  </body>
</html>
