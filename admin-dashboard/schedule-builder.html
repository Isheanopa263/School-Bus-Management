<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schedule Builder - Bus Tracking Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/buses.css" />
    <link rel="stylesheet" href="assets/css/schedule-builder.css" />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <nav class="nav">
      <div class="nav-container">
        <div class="nav-brand">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path
              d="M4 16V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10"
              stroke="currentColor"
              stroke-width="2"
            />
            <path
              d="M4 16h16v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2z"
              fill="currentColor"
            />
          </svg>
          <span>Bus Tracking</span>
        </div>
        <div class="nav-links">
          <a href="./dashboard.html" class="nav-link">Dashboard</a>
          <a href="./live-tracking.html" class="nav-link">Live Tracking</a>
          <a href="./schedule-builder.html" class="nav-link active"
            >Schedules</a
          >
          <a href="./buses.html" class="nav-link">Buses</a>
          <a href="./drivers.html" class="nav-link">Drivers</a>
          <a href="./student-requests.html" class="nav-link">Requests</a>
          <a href="./routes.html" class="nav-link">Routes</a>

          <a href="./complaints.html" class="nav-link">Complaints</a>
          <a href="./reports.html" class="nav-link">Reports</a>
        </div>
        <button id="logoutBtn" class="btn-logout">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path
              d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"
              stroke="currentColor"
              stroke-width="2"
            />
            <path
              d="M16 17l5-5-5-5M21 12H9"
              stroke="currentColor"
              stroke-width="2"
            />
          </svg>
          <span>Logout</span>
        </button>
      </div>
    </nav>

    <main class="main">
      <div class="header">
        <div>
          <h1>Schedule Builder</h1>
          <p class="subtitle">Manage weekly bus schedules</p>
        </div>
        <button id="addScheduleBtn" class="btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" />
          </svg>
          Add Schedule
        </button>
      </div>

      <div class="card">
        <div class="filters">
          <select id="busFilter" class="filter-select">
            <option value="">All Buses</option>
          </select>
          <select id="driverFilter" class="filter-select">
            <option value="">All Drivers</option>
          </select>
        </div>

        <div class="schedule-grid-wrapper">
          <div class="time-labels" id="timeLabels"></div>
          <div class="schedule-grid" id="scheduleGrid"></div>
        </div>
      </div>
    </main>

    <!-- Add/Edit Modal -->
    <div id="scheduleModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modalTitle">Add Schedule</h2>
          <button class="modal-close" id="closeModal">&times;</button>
        </div>
        <form id="scheduleForm">
          <input type="hidden" id="scheduleId" />
          <div class="form-group">
            <label for="busSelect">Bus *</label>
            <select id="busSelect" required></select>
          </div>
          <div class="form-group">
            <label for="routeSelect">Route *</label>
            <select id="routeSelect" required></select>
          </div>
          <div class="form-group">
            <label for="driverSelect">Driver *</label>
            <select id="driverSelect" required></select>
          </div>
          <div class="form-group">
            <label for="daySelect">Day *</label>
            <select id="daySelect" required>
              <option value="1">Monday</option>
              <option value="2">Tuesday</option>
              <option value="3">Wednesday</option>
              <option value="4">Thursday</option>
              <option value="5">Friday</option>
              <option value="6">Saturday</option>
              <option value="0">Sunday</option>
            </select>
          </div>
          <div class="form-group">
            <label for="startTime">Start Time *</label>
            <input type="time" id="startTime" required />
          </div>
          <div class="form-group">
            <label for="endTime">End Time *</label>
            <input type="time" id="endTime" required />
          </div>
          <div class="error-msg" id="conflictError"></div>
          <div class="modal-footer">
            <button type="button" class="btn-secondary" id="cancelBtn">
              Cancel
            </button>
            <button type="submit" class="btn-primary" id="saveBtn">
              Save Schedule
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="assets/js/auth.js"></script>
    <script src="assets/js/schedule-builder.js"></script>
  </body>
</html>
