<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buses - Bus Tracking Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/buses.css" />
  </head>
  <body>
    <nav class="nav">
      <div class="nav-container">
        <div class="nav-brand">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path
              d="M4 16V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10"
              stroke="currentColor"
              stroke-width="2"
            />
            <path
              d="M4 16h16v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2z"
              fill="currentColor"
            />
          </svg>
          <span>Bus Tracking</span>
        </div>
        <div class="nav-links">
          <a href="./dashboard.html" class="nav-link">Dashboard</a>
          <a href="./live-tracking.html" class="nav-link">Live Tracking</a>
          <a href="./schedule-builder.html" class="nav-link"
            >Schedule Builder</a
          >
          <a href="./buses.html" class="nav-link active">Buses</a>
          <a href="./drivers.html" class="nav-link">Drivers</a>
          <a href="./student-requests.html" class="nav-link">Requests</a>
          <a href="./routes.html" class="nav-link">Routes</a>
          <a href="./complaints.html" class="nav-link">Complaints</a>
          <a href="./reports.html" class="nav-link">Reports</a>
        </div>
        <button id="logoutBtn" class="btn-logout">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path
              d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"
              stroke="currentColor"
              stroke-width="2"
            />
            <path
              d="M16 17l5-5-5-5M21 12H9"
              stroke="currentColor"
              stroke-width="2"
            />
          </svg>
          <span>Logout</span>
        </button>
      </div>
    </nav>

    <main class="main">
      <div class="header">
        <div>
          <h1>Buses</h1>
          <p class="subtitle">Manage your fleet</p>
        </div>
        <button id="addBusBtn" class="btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" />
          </svg>
          Add Bus
        </button>
      </div>

      <div class="card">
        <div class="table-wrapper">
          <table class="table">
            <thead>
              <tr>
                <th>Reg Number</th>
                <th>Model</th>
                <th>Capacity</th>
                <th>GPS Device</th>
                <th>Driver</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="busesTableBody">
              <tr>
                <td colspan="7" class="loading">Loading buses...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Add/Edit Modal -->
    <div id="busModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modalTitle">Add Bus</h2>
          <button class="modal-close" id="closeModal">&times;</button>
        </div>
        <form id="busForm">
          <input type="hidden" id="busId" />
          <div class="form-group">
            <label for="regNumber">Registration Number *</label>
            <input
              type="text"
              id="regNumber"
              required
              placeholder="e.g. AP05-AB-1234"
            />
          </div>
          <div class="form-group">
            <label for="capacity">Capacity *</label>
            <input
              type="number"
              id="capacity"
              required
              placeholder="e.g. 50"
              min="1"
            />
          </div>
          <div class="form-group">
            <label for="model">Model</label>
            <input type="text" id="model" placeholder="e.g. Tata Starbus" />
          </div>
          <div class="form-group">
            <label for="gpsDeviceId">GPS Device ID</label>
            <input type="text" id="gpsDeviceId" placeholder="e.g. GPS-001" />
          </div>
          <div class="form-group">
            <label for="status">Status</label>
            <select id="status">
              <option value="active">Active</option>
              <option value="maintenance">Maintenance</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn-secondary" id="cancelBtn">
              Cancel
            </button>
            <button type="submit" class="btn-primary" id="saveBtn">
              Save Bus
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Delete Confirm Modal -->
    <div id="deleteModal" class="modal">
      <div class="modal-content modal-sm">
        <div class="modal-header">
          <h2>Delete Bus</h2>
        </div>
        <p>
          Are you sure you want to delete <strong id="deleteBusName"></strong>?
          This cannot be undone.
        </p>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" id="cancelDeleteBtn">
            Cancel
          </button>
          <button type="button" class="btn-danger" id="confirmDeleteBtn">
            Delete
          </button>
        </div>
      </div>
    </div>

    <script src="assets/js/auth.js"></script>
    <script src="assets/js/buses.js"></script>
  </body>
</html>
