<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#10b981" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>BusTrack Student</title>
    <link rel="manifest" href="manifest.json" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="assets/css/app.css" />

    <!-- ══════ WELCOME ══════ -->
    <template id="tpl-welcome">
      <div class="screen">
        <div class="auth-wrapper">
          <div class="auth-bg">
            <div class="gradient-orb orb-1"></div>
            <div class="gradient-orb orb-2"></div>
            <div class="grid-pattern"></div>
          </div>
          <div class="auth-card">
            <div class="auth-card-header">
              <div class="auth-logo">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
                  <path
                    d="M4 16V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10"
                    stroke="#10b981"
                    stroke-width="2"
                  />
                  <path
                    d="M4 16h16v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2z"
                    fill="#10b981"
                  />
                  <circle cx="7.5" cy="16.5" r="1.5" fill="white" />
                  <circle cx="16.5" cy="16.5" r="1.5" fill="white" />
                </svg>
              </div>
              <h1>BusTrack Student</h1>
              <p>Your school bus companion</p>
            </div>
            <div class="auth-form">
              <button class="btn-login" id="goLoginBtn">Sign In</button>
              <button class="btn btn-outline" id="goRegisterBtn">
                Create Account
              </button>
            </div>
            <div class="auth-footer">
              <p>© 2026 BusTrack. All rights reserved.</p>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- ══════ LOGIN ══════ -->
    <template id="tpl-login">
      <div class="screen">
        <div class="auth-wrapper">
          <div class="auth-bg">
            <div class="gradient-orb orb-1"></div>
            <div class="gradient-orb orb-2"></div>
            <div class="grid-pattern"></div>
          </div>
          <div class="auth-card">
            <div class="auth-card-header">
              <div class="auth-logo">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
                  <path
                    d="M4 16V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10"
                    stroke="#10b981"
                    stroke-width="2"
                  />
                  <path
                    d="M4 16h16v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2z"
                    fill="#10b981"
                  />
                  <circle cx="7.5" cy="16.5" r="1.5" fill="white" />
                  <circle cx="16.5" cy="16.5" r="1.5" fill="white" />
                </svg>
              </div>
              <h1>Sign In</h1>
              <p>Welcome back to BusTrack</p>
            </div>
            <form class="auth-form" id="loginForm">
              <div class="form-error" id="loginError"></div>
              <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                  <svg
                    class="input-icon"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                    />
                    <polyline points="22,6 12,13 2,6" />
                  </svg>
                  <input
                    type="email"
                    id="loginEmail"
                    class="form-input"
                    placeholder="student@email.com"
                  />
                </div>
              </div>
              <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                  <svg
                    class="input-icon"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                  </svg>
                  <input
                    type="password"
                    id="loginPassword"
                    class="form-input"
                    placeholder="••••••••"
                  />
                </div>
              </div>
              <button type="button" class="btn-login" id="loginBtn">
                <span id="loginBtnText">Sign In</span>
              </button>
            </form>
            <div class="auth-footer">
              <p>
                Don't have an account? <a id="loginToRegister">Create one</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- ══════ REGISTER ══════ -->
    <template id="tpl-register">
      <div class="screen">
        <div class="auth-wrapper">
          <div class="auth-bg">
            <div class="gradient-orb orb-1"></div>
            <div class="gradient-orb orb-2"></div>
            <div class="grid-pattern"></div>
          </div>
          <div class="auth-card" style="max-width: 460px">
            <div class="auth-card-header">
              <div class="auth-logo">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
                  <path
                    d="M4 16V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10"
                    stroke="#10b981"
                    stroke-width="2"
                  />
                  <path
                    d="M4 16h16v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2z"
                    fill="#10b981"
                  />
                  <circle cx="7.5" cy="16.5" r="1.5" fill="white" />
                  <circle cx="16.5" cy="16.5" r="1.5" fill="white" />
                </svg>
              </div>
              <h1>Create Account</h1>
              <p>Join BusTrack today</p>
            </div>
            <form class="auth-form" id="registerForm">
              <div class="form-error" id="registerError"></div>
              <div class="form-section-title">Personal Details</div>
              <div class="form-group">
                <label>Full Name *</label>
                <div class="input-wrapper">
                  <svg
                    class="input-icon"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                  </svg>
                  <input
                    type="text"
                    id="regName"
                    class="form-input"
                    placeholder="Your full name"
                  />
                </div>
              </div>
              <div class="form-group">
                <label>Phone *</label>
                <div class="input-wrapper">
                  <svg
                    class="input-icon"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-5.69-5.69A19.79 19.79 0 0 1 2.62 4.59 2 2 0 0 1 4.59 2.38h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l.89-.89a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"
                    />
                  </svg>
                  <input
                    type="tel"
                    id="regPhone"
                    class="form-input"
                    placeholder="09XXXXXXXXX"
                  />
                </div>
              </div>
              <div class="form-group">
                <label>Email</label>
                <div class="input-wrapper">
                  <svg
                    class="input-icon"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                    />
                    <polyline points="22,6 12,13 2,6" />
                  </svg>
                  <input
                    type="email"
                    id="regEmail"
                    class="form-input"
                    placeholder="Optional"
                  />
                </div>
              </div>
              <div class="form-group">
                <label>Password *</label>
                <div class="input-wrapper">
                  <svg
                    class="input-icon"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                  </svg>
                  <input
                    type="password"
                    id="regPassword"
                    class="form-input"
                    placeholder="Min 6 characters"
                  />
                </div>
              </div>
              <div class="form-section-title">Student Details</div>
              <div class="form-group">
                <label>Roll Number</label>
                <div class="input-wrapper">
                  <svg
                    class="input-icon"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                    />
                    <polyline points="14 2 14 8 20 8" />
                  </svg>
                  <input
                    type="text"
                    id="regRoll"
                    class="form-input"
                    placeholder="e.g. 22A91A0501"
                  />
                </div>
              </div>
              <div class="form-group">
                <label>Emergency Contact</label>
                <div class="input-wrapper">
                  <svg
                    class="input-icon"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-5.69-5.69A19.79 19.79 0 0 1 2.62 4.59 2 2 0 0 1 4.59 2.38h3"
                    />
                  </svg>
                  <input
                    type="tel"
                    id="regEmergency"
                    class="form-input"
                    placeholder="Parent/Guardian phone"
                  />
                </div>
              </div>
              <button type="button" class="btn-login" id="registerBtn">
                <span id="registerBtnText">Create Account</span>
              </button>
            </form>
            <div class="auth-footer">
              <p>
                Already have an account? <a id="registerToLogin">Sign in</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- ══════ MAIN APP WITH SIDEBAR ══════ -->
    <template id="tpl-main">
      <div class="screen">
        <!-- Mobile Top Nav -->
        <nav class="top-nav-mobile">
          <button class="menu-toggle" id="menuToggle">
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
          </button>
          <div class="top-nav-brand-mobile">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path
                d="M4 16V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10"
                stroke="currentColor"
                stroke-width="2"
              />
              <path
                d="M4 16h16v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2z"
                fill="currentColor"
              />
            </svg>
            <span>BusTrack</span>
          </div>
          <button
            class="theme-toggle-icon"
            id="themeToggle"
            title="Toggle theme"
          >
            <svg
              id="themeIconDark"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
            <svg
              id="themeIconLight"
              class="hidden"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="5" />
              <line x1="12" y1="1" x2="12" y2="3" />
              <line x1="12" y1="21" x2="12" y2="23" />
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
              <line x1="1" y1="12" x2="3" y2="12" />
              <line x1="21" y1="12" x2="23" y2="12" />
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
            </svg>
          </button>
        </nav>

        <div class="app-layout">
          <!-- Sidebar -->
          <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
              <div class="sidebar-brand">
                <div class="sidebar-brand-icon">
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                    <path
                      d="M4 16V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10"
                      stroke="#10b981"
                      stroke-width="2"
                    />
                    <path
                      d="M4 16h16v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2z"
                      fill="#10b981"
                    />
                    <circle cx="7.5" cy="16.5" r="1.5" fill="white" />
                    <circle cx="16.5" cy="16.5" r="1.5" fill="white" />
                  </svg>
                </div>
                <span class="sidebar-title">BusTrack</span>
              </div>
              <div style="display: flex; gap: 6px">
                <button
                  class="theme-toggle-icon"
                  id="themeToggle"
                  title="Toggle theme"
                >
                  <svg
                    id="themeIconDark"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                  </svg>
                  <svg
                    id="themeIconLight"
                    class="hidden"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <circle cx="12" cy="12" r="5" />
                    <line x1="12" y1="1" x2="12" y2="3" />
                    <line x1="12" y1="21" x2="12" y2="23" />
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                    <line x1="1" y1="12" x2="3" y2="12" />
                    <line x1="21" y1="12" x2="23" y2="12" />
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                  </svg>
                </button>
                <button class="sidebar-collapse-btn" id="sidebarCollapse">
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <polyline points="15 18 9 12 15 6" />
                  </svg>
                </button>
              </div>
            </div>

            <!-- Student Profile -->
            <div class="sidebar-profile">
              <div class="profile-avatar" id="sidebarAvatar">S</div>
              <div class="profile-info">
                <div class="profile-name" id="sidebarStudentName">Student</div>
                <div class="profile-bus" id="sidebarStudentRoll">
                  Loading...
                </div>
              </div>
            </div>

            <nav class="sidebar-nav">
              <div class="sidebar-section-label">Main</div>

              <button class="sidebar-link active" data-tab="home">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                  <polyline points="9 22 9 12 15 12 15 22" />
                </svg>
                <span class="sidebar-link-text">Dashboard</span>
              </button>

              <button class="sidebar-link" data-tab="tracking">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                  <circle cx="12" cy="10" r="3" />
                </svg>
                <span class="sidebar-link-text">Live Tracking</span>
              </button>

              <div class="sidebar-section-label">Bus Service</div>

              <button class="sidebar-link" data-tab="bus">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <rect x="3" y="5" width="18" height="12" rx="2" />
                  <path d="M7 17v2M17 17v2" />
                </svg>
                <span class="sidebar-link-text">My Bus</span>
              </button>

              <div class="sidebar-section-label">Communication</div>

              <button class="sidebar-link" data-tab="notifications">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                  <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                </svg>
                <span class="sidebar-link-text">Notifications</span>
              </button>

              <button class="sidebar-link" data-tab="complaint">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
                  />
                  <line x1="12" y1="9" x2="12" y2="13" />
                  <line x1="12" y1="17" x2="12.01" y2="17" />
                </svg>
                <span class="sidebar-link-text">Report Issue</span>
              </button>

              <div class="sidebar-section-label">Account</div>

              <button class="sidebar-link" data-tab="profile">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
                <span class="sidebar-link-text">My Profile</span>
              </button>
            </nav>

            <!-- Sidebar Footer with Logout -->
            <div class="sidebar-footer">
              <button class="sidebar-link logout-link" id="logoutBtn">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                  <polyline points="16 17 21 12 16 7" />
                  <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
                <span class="sidebar-link-text">Logout</span>
              </button>
            </div>
          </aside>

          <!-- Sidebar Overlay (mobile) -->
          <div class="sidebar-overlay" id="sidebarOverlay"></div>

          <!-- Content Area -->
          <div class="content-area">
            <!-- Home -->
            <div class="tab-content active" id="tab-home">
              <div class="home-greeting">
                <div class="home-greeting-name" id="greetingName">Hello 👋</div>
                <div class="home-greeting-sub" id="greetingDate"></div>
              </div>
              <div id="tripBanner" class="hidden"></div>
              <div class="status-card" id="homeStatusCard">
                <div style="text-align: center; padding: 20px">
                  <div class="spinner"></div>
                  <p style="color: var(--text-muted); font-size: 14px">
                    Loading...
                  </p>
                </div>
              </div>
              <div class="quick-actions">
                <button
                  class="quick-action-card"
                  onclick="App.switchTab('bus')"
                >
                  <div class="quick-action-icon">🚌</div>
                  <div class="quick-action-label">Bus Service</div>
                </button>
                <button
                  class="quick-action-card"
                  onclick="App.switchTab('tracking')"
                >
                  <div class="quick-action-icon">📍</div>
                  <div class="quick-action-label">Live Track</div>
                </button>
                <button
                  class="quick-action-card"
                  onclick="App.switchTab('notifications')"
                >
                  <div class="quick-action-icon">🔔</div>
                  <div class="quick-action-label">Notifications</div>
                </button>
                <button
                  class="quick-action-card"
                  onclick="App.switchTab('complaint')"
                >
                  <div class="quick-action-icon">⚠️</div>
                  <div class="quick-action-label">Report Issue</div>
                </button>
              </div>
            </div>

            <!-- Bus -->
            <div class="tab-content" id="tab-bus">
              <div class="page-header">
                <div>
                  <h1>Bus Service</h1>
                  <p class="subtitle">Manage your bus assignment</p>
                </div>
              </div>
              <div id="busContent">
                <div style="text-align: center; padding: 40px">
                  <div class="spinner"></div>
                </div>
              </div>
            </div>

            <!-- Tracking -->
            <div class="tab-content" id="tab-tracking">
              <div class="page-header">
                <div>
                  <h1>Live Tracking</h1>
                  <p class="subtitle">Track your bus in real-time</p>
                </div>
                <button
                  class="btn btn-secondary btn-sm"
                  id="refreshTrackingBtn"
                >
                  Refresh
                </button>
              </div>
              <div id="trackingContent">
                <div style="text-align: center; padding: 40px">
                  <div class="spinner"></div>
                </div>
              </div>
            </div>

            <!-- Notifications -->
            <div class="tab-content" id="tab-notifications">
              <div class="page-header">
                <div>
                  <h1>Notifications</h1>
                  <p class="subtitle">Your recent updates</p>
                </div>
              </div>
              <div id="notificationsContent">
                <div style="text-align: center; padding: 40px">
