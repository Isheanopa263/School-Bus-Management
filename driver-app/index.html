<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BusDriver" />

    <title>Bus Driver App</title>

    <link rel="manifest" href="manifest.json" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/app.css" />

    <!-- Screen: Login -->
    <template id="tpl-login">
      <div class="screen" id="screen-login">
        <div class="login-wrapper">
          <div class="login-bg">
            <div class="gradient-orb orb-1"></div>
            <div class="gradient-orb orb-2"></div>
            <div class="grid-pattern"></div>
          </div>

          <div class="login-card">
            <div class="login-header">
              <div class="logo">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
                  <path
                    d="M4 16V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10"
                    stroke="#0ea5e9"
                    stroke-width="2"
                  />
                  <path
                    d="M4 16h16v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2z"
                    fill="#0ea5e9"
                  />
                  <circle cx="7.5" cy="16.5" r="1.5" fill="white" />
                  <circle cx="16.5" cy="16.5" r="1.5" fill="white" />
                </svg>
              </div>
              <h1>BusTrack Driver</h1>
              <p>Sign in to start your shift</p>
            </div>

            <form id="login-form" class="login-form" novalidate>
              <div class="form-group">
                <label for="email">Email address</label>
                <div class="input-wrapper">
                  <svg
                    class="input-icon"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                    />
                    <polyline points="22,6 12,13 2,6" />
                  </svg>
                  <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="driver@bustrack.com"
                    required
                    autocomplete="email"
                  />
                </div>
                <span class="field-error" id="email-error"></span>
              </div>

              <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                  <svg
                    class="input-icon"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                  </svg>
                  <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="••••••••"
                    required
                    autocomplete="current-password"
                  />
                  <button type="button" id="toggle-password" class="toggle-pwd">
                    <svg
                      width="20"
                      height="20"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                  </button>
                </div>
                <span class="field-error" id="password-error"></span>
              </div>

              <div class="form-error" id="form-error"></div>

              <button type="submit" class="btn-submit" id="login-btn">
                <span class="btn-text">Sign in</span>
                <svg
                  class="btn-text"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <line x1="5" y1="12" x2="19" y2="12" />
                  <polyline points="12 5 19 12 12 19" />
                </svg>
                <span class="btn-loader hidden">
                  <svg width="20" height="20" viewBox="0 0 24 24" class="spin">
                    <circle
                      cx="12"
                      cy="12"
                      r="10"
                      stroke="white"
                      stroke-width="3"
                      fill="none"
                      stroke-dasharray="31.4 31.4"
                      stroke-linecap="round"
                    />
                  </svg>
                </span>
              </button>
            </form>

            <div class="login-footer">
              <p>Having trouble? Contact your administrator</p>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- Screen: Route View -->
    <template id="tpl-route">
      <div class="screen" id="screen-route">
        <!-- Nav Bar -->
        <nav class="nav">
          <div class="nav-container">
            <div class="nav-brand">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path
                  d="M4 16V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10"
                  stroke="currentColor"
                  stroke-width="2"
                />
                <path
                  d="M4 16h16v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2z"
                  fill="currentColor"
                />
              </svg>
              <span>BusTrack Driver</span>
            </div>
            <div class="nav-right">
              <div class="driver-info-nav">
                <span class="driver-name-nav" id="header-driver-name"
                  >Driver</span
                >
                <span class="driver-bus-nav" id="header-bus-number"
                  >Loading...</span
                >
              </div>
              <button id="logout-btn" class="btn-logout">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path
                    d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"
                    stroke="currentColor"
                    stroke-width="2"
                  />
                  <path
                    d="M16 17l5-5-5-5M21 12H9"
                    stroke="currentColor"
                    stroke-width="2"
                  />
                </svg>
                <span>Logout</span>
              </button>
            </div>
          </div>
        </nav>

        <main class="main">
          <!-- Route Summary Card -->
          <div class="route-summary card" id="route-summary">
            <div class="summary-loading">
              <div class="spinner"></div>
              <p>Loading today's route...</p>
            </div>
          </div>

          <!-- Stops + Students List -->
          <div class="stops-section">
            <div class="section-header">
              <div>
                <h2>Stops & Students</h2>
                <p class="subtitle">Tap a stop to view students</p>
              </div>
              <span class="badge-count" id="stops-count">-</span>
            </div>
            <div id="stops-list" class="stops-list">
              <!-- Populated by route-view.js -->
            </div>
          </div>
        </main>
      </div>
    </template>

    <!-- App Mount Point -->
    <div id="app"></div>

    <!-- Scripts -->
    <script src="assets/js/api.js"></script>
    <script src="assets/js/login.js"></script>
    <script src="assets/js/route-view.js"></script>
    <script src="assets/js/app.js"></script>
  </head>
  <body></body>
</html>
